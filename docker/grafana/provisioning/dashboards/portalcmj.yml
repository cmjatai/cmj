apiVersion: 1

# Os JSONs de docker/grafana/dashboards são a fonte: alterações feitas pela
# interface do Grafana não são gravadas de volta. Para mudar um painel,
# exporte o JSON e substitua o arquivo no repositório.
providers:
  - name: portalcmj
    folder: PortalCMJ
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
