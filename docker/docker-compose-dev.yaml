name: portalcmj
services:
  # Monitoramento leve do dev: só as métricas da aplicação (cmj:9000 e o
  # runserver do host em 9098). A stack completa, com exporters, está em
  # docker-compose-monitoring.yaml (produção e produção simulada).
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: 'no'
    labels:
       NAME: "prometheus"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - cmj-net
  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    restart: 'no'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    container_name: grafana
    labels:
      NAME: "grafana"
    networks:
      - cmj-net

  cmjredis:
    image: redis:alpine
    container_name: cmjredis
    restart: no
    labels:
       NAME: "cmjredis"
    volumes:
      - credis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - cmj-net
  cmjsolr:
    image: solr:9.5
    restart: no
    command: bin/solr start -c -f
    container_name: cmjsolr
    labels:
        NAME: "cmjsolr"
    volumes:
      - csolr_data:/var/solr
      - csolr_configsets:/opt/solr/server/solr/configsets
    ports:
      - "127.0.0.1:8983:8983"
      - "127.0.0.1:9983:9983"
    networks:
      - cmj-net
  cmjfront2018:
    build:
      context: ../_frontend/v2018/
      dockerfile: ../../docker/Dockerfile.Front2018Dev
    #command: yarn build
    restart: no
    container_name: cmjfront2018
    labels:
       NAME: "cmjfront2018"
    volumes:
      - ../:/var/cmjatai/cmj
    networks:
      - cmj-net
    ports:
      - "8080:8080"
  cmjfront2026:
    build:
      context: ../_frontend/v6/
      dockerfile: ../../docker/Dockerfile.Front2026Dev
    #command: yarn build
    restart: no
    container_name: cmjfront2026
    labels:
       NAME: "cmjfront2026"
    volumes:
      - ../:/var/cmjatai/cmj
    networks:
      - cmj-net
    ports:
      - "5173:5173"
  cmjfrontv8:
    build:
      context: ../_frontend/v8/
      dockerfile: ../../docker/Dockerfile.FrontV8Dev
    #command: yarn build
    restart: no
    container_name: cmjfrontv8
    labels:
       NAME: "cmjfrontv8"
    volumes:
      - ../:/var/cmjatai/cmj
    networks:
      - cmj-net
    ports:
      - "5174:5174"
  cmjdb18:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: always
    container_name: cmjpostgres18
    labels:
        NAME: "cmjpostgres18"
    environment:
      POSTGRES_PASSWORD: cmj
      POSTGRES_USER: cmj
      POSTGRES_DB: cmj
      PGDATA : /var/lib/postgresql/data/
    volumes:
      - cmjdb18_data:/var/lib/postgresql/data/
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5433:5432"
    networks:
      - cmj-net
  cmj:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.Dev
    container_name: cmj
    labels:
      NAME: "cmj"
    restart: no
    environment:
      DEBUG: 'True'
      USE_SOLR: 'True'
      SOLR_COLLECTIONS: portalcmj_cmj,portalcmj_arq
      SOLR_URL: http://solr:solr@cmjsolr:8983
      IS_ZK_EMBEDDED: 'True'
      TZ: America/Sao_Paulo
    volumes:
      - /mnt/volumes/cmj_media:/var/cmjatai/cmj_media
      - ../:/var/cmjatai/cmj
    depends_on:
      - cmjredis
      - cmjfront2018
      - cmjfront2026
      - cmjfrontv8
      - cmjsolr
      - cmjdb18
    ports:
      - "9099:9000"
    networks:
      - cmj-net
networks:
  cmj-net:
    name: cmj-net
    driver: bridge
volumes:
  csolr_data:
  csolr_configsets:
  credis_data:
  cmjdb18_data:
  prometheus_data:
  grafana_data:
