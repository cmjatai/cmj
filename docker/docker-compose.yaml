name: portalcmj
# Prometheus, Grafana e exporters: docker-compose-monitoring.yaml, configurado
# pelo docker/.env do servidor (não versionado; modelo em docker/.env.example).
include:
  - docker-compose-monitoring.yaml
services:
  cmjredis:
    image: redis:alpine
    container_name: cmjredis
    restart: always #restart: unless-stopped
    labels:
       NAME: "cmjredis"
    volumes:
      - credis_data:/data
    #ports:
    #  - "6379:6379"
    networks:
      - cmj-net
  cmjsolr:
    image: solr:9.5
    restart: always
    command: bin/solr start -c -f
    container_name: cmjsolr
    environment:
      - SOLR_HEAP=4g
    labels:
        NAME: "cmjsolr"
    volumes:
      - csolr9_data:/var/solr
      - csolr9_configsets:/opt/solr/server/solr/configsets
    #ports:
    #  - "8983:8983"
    networks:
      - cmj-net
  cmjdb18:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: always
    container_name: cmjpostgres18
    labels:
        NAME: "cmjpostgres18"
    environment:
      POSTGRES_PASSWORD: cmj
      POSTGRES_USER: cmj
      POSTGRES_DB: cmj
      PGDATA : /var/lib/postgresql/data/
    volumes:
      - cmjdb18_data:/var/lib/postgresql/data/
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    #ports:
    #  - "5433:5432"
    networks:
      - cmj-net
  cmj-blue:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    container_name: cmj-blue
    user: "root:root"
    labels:
       NAME: "cmj-blue"
    restart: always
    environment:
      DEBUG: 'False'
      USE_SOLR: 'True'
      SOLR_COLLECTIONS: portalcmj_cmj,portalcmj_arq
      SOLR_URL: http://solr:solr@cmjsolr:8983
      IS_ZK_EMBEDDED: 'True'
      TZ: America/Sao_Paulo
    volumes:
      - cmj_data:/var/cmjatai/cmj_data
      - cmj_media:/var/cmjatai/cmj_media
      - cmj_logs:/var/cmjatai/cmj/logs
    depends_on:
      - cmjdb18
      - cmjredis
      - cmjsolr
    ports:
      - "127.0.0.1:8001:80"
    networks:
      - cmj-net
  cmj-green:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    container_name: cmj-green
    user: "root:root"
    labels:
       NAME: "cmj-green"
    restart: always
    environment:
      DEBUG: 'False'
      USE_SOLR: 'True'
      SOLR_COLLECTIONS: portalcmj_cmj,portalcmj_arq
      SOLR_URL: http://solr:solr@cmjsolr:8983
      IS_ZK_EMBEDDED: 'True'
      TZ: America/Sao_Paulo
    volumes:
      - cmj_data:/var/cmjatai/cmj_data
      - cmj_media:/var/cmjatai/cmj_media
      - cmj_logs:/var/cmjatai/cmj/logs
    depends_on:
      - cmjdb18
      - cmjredis
      - cmjsolr
    ports:
      - "127.0.0.1:8002:80"
    networks:
      - cmj-net
networks:
  cmj-net:
    name: cmj-net
    driver: bridge
volumes:
  cmjdb18_data:
  cmj_data:
  cmj_media:
  cmj_logs:
  csolr9_data:
  csolr9_configsets:
  credis_data:
  prometheus_data:
  grafana_data: