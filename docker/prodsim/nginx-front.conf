# nginx da frente da produção simulada: faz o papel do nginx do host da
# produção, que fica fora do repositório. Reproduz o que pesa para a
# aplicação: TLS, cabeçalhos repassados (X-Real-IP e
# $proxy_add_x_forwarded_for, que mantém o X-Forwarded-For enviado pelo
# cliente), 444 nas extensões e no parâmetro u, limit_req em dry-run na API e
# o log separado de respostas que não são 1xx, 2xx nem 3xx, que é o que o
# fail2ban lê na produção. Nada aqui tem domínio ou IP reais.

map $status $not_found {
    ~^[123]  0;
    default  1;
}
map $status $is_success {
    ~^[123]  1;
    default  0;
}

log_format custom_combined '[$time_local] $remote_addr - $remote_user "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for" id="$request_id"';

# Só na simulação: do host, toda requisição chega aqui com IP privado (gateway
# do docker), e o /metrics ficaria sempre liberado. O cabeçalho
# X-Simula-IP-Cliente troca o $remote_addr, para o smoke.sh se passar por um
# cliente da internet. Sem o cabeçalho, nada muda.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Simula-IP-Cliente;

limit_req_zone $binary_remote_addr zone=api_por_ip:10m rate=20r/s;

# DNS do docker: cmj-green só existe com o profile green, e o "resolve" deixa
# o nginx subir sem ele.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream cmj_backend {
    zone cmj_backend 64k;
    server cmj-blue:80 resolve;
    server cmj-green:80 resolve;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/front_access.log custom_combined if=$is_success;
    access_log /var/log/nginx/front_error_requests.log custom_combined if=$not_found;

    location ~ \.(php|asp|aspx|jsp|cgi|pl|exe|env|git)$ {
        return 444;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/prodsim.crt;
    ssl_certificate_key /etc/nginx/certs/prodsim.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4G;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/front_access.log custom_combined if=$is_success;
    access_log /var/log/nginx/front_error_requests.log custom_combined if=$not_found;

    location ~ \.(php|asp|aspx|jsp|cgi|pl|exe|env|git)$ {
        return 444;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_pass http://cmj_backend;
    }

    location /api {
        if ($arg_u != "") {
            return 444;
        }

        limit_req zone=api_por_ip burst=60 nodelay;
        limit_req_dry_run on;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Redirect "";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
        send_timeout 600s;
        proxy_buffering off;

        proxy_pass http://cmj_backend;
        proxy_redirect http://cmj_backend https://$host:8443;

        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'";
    }

    location / {
        if ($arg_u != "") {
            return 444;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Redirect "";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
        send_timeout 600s;
        proxy_buffering off;

        proxy_pass http://cmj_backend;
        proxy_redirect http://cmj_backend https://$host:8443;

        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'";
    }
}
