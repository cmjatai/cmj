# Produção e produção simulada (docker/docker-compose-monitoring.yaml).
# Os alvos são nomes de container, que existem nos dois ambientes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # django_prometheus via nginx do container (/metrics só para redes privadas)
  - job_name: django
    static_configs:
      - targets: ["cmj-blue:80"]
        labels: { color: blue, app: portalcmj }
      - targets: ["cmj-green:80"]
        labels: { color: green, app: portalcmj }

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter-blue:9113"]
        labels: { color: blue }
      - targets: ["nginx-exporter-green:9113"]
        labels: { color: green }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { namespace: cmj }

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels: { cluster: cmj, namespace: cmj }

  - job_name: solr
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ["solr-exporter:9854"]
