# Dev (docker/docker-compose-dev.yaml): só as métricas da aplicação.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: django
    static_configs:
      # runserver do container cmj
      - targets: ["cmj:9000"]
        labels: { color: container, app: portalcmj }
      # runserver no host (python manage.py runserver 0.0.0.0:9098)
      - targets: ["host.docker.internal:9098"]
        labels: { color: host, app: portalcmj }
