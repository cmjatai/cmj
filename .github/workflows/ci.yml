# CI do PortalCMJ: roda no GitHub Actions, numa máquina Linux temporária do GitHub
# (runner padrão, gratuito em repositório público). Não acessa banco nem produção.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  specs:
    # Consistência das specs com testes e código (docs/specs/README.md, seção Checagem).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Só biblioteca padrão do Python: não instala dependências do projeto.
      - run: python cmj/core/services/s_specs_check.py

  frontend-v8:
    # Testes do frontend v8 (Vitest com jsdom). Não roda lint, que corrige arquivos, nem build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _frontend/v8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Sem cache: ele exige o package-lock.json, que não é versionado.
          package-manager-cache: false
      # Sem lock, como no build local: instala as versões mais recentes que o package.json aceita.
      - run: npm install
      - run: npm test
