# CI do PortalCMJ: roda no GitHub Actions, numa máquina Linux temporária do GitHub
# (runner padrão, gratuito em repositório público). Não acessa banco nem produção.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  specs:
    # Consistência das specs com testes e código (docs/specs/README.md, seção Checagem).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Só biblioteca padrão do Python: não instala dependências do projeto.
      - run: python cmj/core/services/s_specs_check.py

  frontend-v8:
    # Testes do frontend v8 (Vitest com jsdom). Não roda lint, que corrige arquivos, nem build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _frontend/v8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # A mesma versão dos containers de desenvolvimento (docker/Dockerfile.Front*Dev).
          node-version: "24.22.3"
          package-manager-cache: false
      # Instala as versões do package-lock.json, que o rebuild dos frontends regenera e commita.
      - run: npm ci
      - run: npm test

  frontend-v2018:
    # Testes do frontend v2018 (Vitest com jsdom). Não roda lint, que corrige arquivos, nem build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _frontend/v2018
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # A mesma versão dos containers de desenvolvimento (docker/Dockerfile.Front*Dev).
          node-version: "24.22.3"
          package-manager-cache: false
      # Instala as versões do package-lock.json, que o rebuild dos frontends regenera e commita.
      - run: npm ci
      - run: npm test
