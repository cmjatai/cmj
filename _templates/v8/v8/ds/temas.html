{% extends "v8/layouts/app_sidebar.html" %}
{% block content %}
  <h1 class="v8-pagina-titulo">Temas</h1>
  <ul class="grid grid-cols-[repeat(auto-fill,minmax(16rem,1fr))] gap-4" data-ds-temas>
    {% for tema in temas %}
      <li class="v8-cartao flex flex-col gap-3" data-ds-tema="{{ tema.nome }}"{% if tema.em_vigor %} aria-current="true"{% endif %}>
        <h2 class="font-titulo text-lg font-semibold">{{ tema.rotulo }}</h2>
        <p class="flex items-center gap-2"><code>{{ tema.nome }}</code>{% if tema.em_vigor %}<span class="v8-etiqueta v8-etiqueta-ok">Em uso</span>{% endif %}</p>
        <div class="v8-barra-acoes">
          <a class="v8-btn" href="{{ tema.url_previa }}">Prévia</a>
          {% if pode_usar_tema %}<form method="post" action="{{ tema.url_usar }}">{% csrf_token %}<button type="submit" class="v8-btn v8-btn-primario">Usar este tema</button></form>{% endif %}
        </div>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
