{% if v8.trilha %}
  <nav class="v8-trilha" aria-label="Trilha">
    <ol data-v8-trilha>
      {% for rotulo, url in v8.trilha %}
        {% if forloop.last %}
          <li aria-current="page">{{ rotulo }}</li>
        {% elif url %}
          <li><a href="{{ url }}">{{ rotulo }}</a></li>
        {% else %}
          <li>{{ rotulo }}</li>
        {% endif %}
      {% endfor %}
    </ol>
  </nav>
{% endif %}
